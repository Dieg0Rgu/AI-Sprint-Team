<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Solicitud OmniStudio</title>
  <style>
    /* Estilos generales y reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Responsive */
    @media screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        padding: 10px !important;
      }
      .content-cell {
        padding: 20px 15px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9;">

  <!-- Preheader oculto (texto previo que aparece en la bandeja de entrada) -->
  <div style="display: none; font-size: 1px; color: #f4f6f9; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;">
    Nueva solicitud de OmniStudio registrada por Miguel.
  </div>

  <!-- Contenedor Principal -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f6f9; padding: 30px 0;">
    <tr>
      <td align="center">
        
        <!-- Tarjeta de Contenido -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container" style="max-width: 580px; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb;">
          
          <!-- Encabezado de Alerta -->
          <tr>
            <td style="background-color: #dc2626; padding: 18px 24px; text-align: left;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="color: #ffffff; font-size: 18px; font-weight: 700; letter-spacing: 0.3px;">
                    🚨 Nueva Solicitud OmniStudio
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Cuerpo del Correo -->
          <tr>
            <td class="content-cell" style="padding: 28px 24px; color: #374151;">
              
              <!-- Tabla de Metadatos -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="font-size: 14px; line-height: 1.6; border-collapse: collapse;">
                
                <!-- Operador -->
                <tr>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; width: 35%; color: #6b7280; font-weight: 600;">
                    👤 Operador
                  </td>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #111827; font-weight: 500;">
                    {{ $json.name }}
                  </td>
                </tr>

                <!-- Correo -->
                <tr>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #6b7280; font-weight: 600;">
                    ✉️ Correo
                  </td>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #111827;">
                    <a href="mailto:{{ $json.email }}" style="color: #2563eb; text-decoration: none; font-weight: 500;">{{ $json.email }}</a>
                  </td>
                </tr>

                <!-- Canal / API -->
                <tr>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #6b7280; font-weight: 600;">
                    📡 Canal / API
                  </td>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #111827;">
                    <span style="background-color: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: 600; border: 1px solid #dbeafe;">
                      {{ $json.channel }}
                    </span>
                  </td>
                </tr>

                <!-- Fecha -->
                <tr>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #6b7280; font-weight: 600;">
                    🕒 Fecha
                  </td>
                  <td style="padding: 8px 0; border-bottom: 1px solid #f3f4f6; color: #374151;">
                    {{ $json.timestamp }}
                  </td>
                </tr>

              </table>

              <!-- Sección del Requerimiento -->
              <div style="margin-top: 24px;">
                <div style="font-size: 14px; font-weight: 700; color: #1f2937; margin-bottom: 8px;">
                  💬 Requerimiento:
                </div>
                <div style="background-color: #f8fafc; border-left: 4px solid #3b82f6; border-radius: 0 6px 6px 0; padding: 12px 16px; color: #1e293b; font-size: 14px; line-height: 1.5; font-style: italic;">
                  {{ $json.message }}
                </div>
              </div>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #f9fafb; padding: 16px 24px; text-align: center; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af;">
              Notificación automática generada por <strong>OmniStudio</strong>.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
